apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ml-research
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download-model
          image: ml-research-init:0.27.0
          imagePullPolicy: IfNotPresent
          command: [python, /opt/ml/app/download_model.py]
          env:
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_ID
            - name: MODEL_REVISION
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_REVISION
            - name: MODEL_DIR
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_DIR
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ml-research-secrets
                  key: HF_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: vllm
          image: ml-research-vllm:0.27.0
          imagePullPolicy: IfNotPresent
          command: [python, /opt/ml/app/serve.py]
          env:
            - name: MODEL_DIR
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_DIR
            - name: VLLM_CONFIG
              value: /config/serve.yaml
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ml-research-secrets
                  key: API_TOKEN
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: VLLM_CPU_KVCACHE_SPACE
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: VLLM_CPU_KVCACHE_SPACE
            - name: OMP_NUM_THREADS
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: OMP_NUM_THREADS
            - name: VLLM_CPU_OMP_THREADS_BIND
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: VLLM_CPU_OMP_THREADS_BIND
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 7Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: config
          configMap:
            name: vllm-config
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
